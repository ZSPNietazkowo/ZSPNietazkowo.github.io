<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SafeSchool - Panel Nauczyciela</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0d1117;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
      text-align: center;
    }

    header h1 {
      font-size: 1.1rem;
      letter-spacing: 1px;
      color: #8b949e;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    header p {
      font-size: 0.8rem;
      color: #484f58;
    }

    /* --- EKRAN LOGOWANIA PIN --- */
    #loginScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0d1117;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
      z-index: 1000;
    }

    #loginScreen.hidden {
      display: none;
    }

    .login-box {
      background: #161b22;
      border: 1px solid #30363d;
      padding: 30px 20px;
      border-radius: 16px;
      width: 100%;
      max-width: 320px;
    }

    .login-box h2 {
      font-size: 1.2rem;
      margin-bottom: 10px;
      color: #c9d1d9;
    }

    .login-box p {
      font-size: 0.85rem;
      color: #8b949e;
      margin-bottom: 20px;
    }

    .pin-input {
      width: 100%;
      padding: 12px;
      font-size: 1.5rem;
      text-align: center;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: white;
      letter-spacing: 5px;
      margin-bottom: 15px;
      outline: none;
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background: #238636;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .login-error {
      color: #f85149;
      font-size: 0.8rem;
      margin-top: 10px;
      display: none;
    }

    /* --- GŁÓWNA APLIKACJA --- */
    .app-content {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-grow: 1;
      justify-content: space-between;
    }

    .threat-selector {
      display: flex;
      gap: 8px;
      width: 100%;
      margin: 15px 0;
    }

    .threat-tab {
      flex: 1;
      background: #161b22;
      border: 2px solid #30363d;
      border-radius: 10px;
      padding: 10px 5px;
      color: #8b949e;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }

    .threat-tab.active.evacuation {
      background: rgba(218, 54, 51, 0.15);
      border-color: #da3633;
      color: #ff7b72;
    }

    .threat-tab.active.intruder {
      background: rgba(187, 128, 9, 0.15);
      border-color: #bb8009;
      color: #e3b341;
    }

    .instruction {
      font-size: 0.85rem;
      color: #8b949e;
      margin-bottom: 10px;
    }

    .zones-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      width: 100%;
      margin-bottom: 10px;
    }

    .zone-btn {
      position: relative;
      background: linear-gradient(145deg, #21262d, #161b22);
      border: 2px solid #30363d;
      border-radius: 12px;
      padding: 15px 10px;
      color: white;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80px;
      outline: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .zone-btn:active {
      transform: scale(0.97);
    }

    .zone-icon {
      font-size: 1.2rem;
      margin-bottom: 3px;
    }

    .progress-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 0%;
      background: rgba(218, 54, 51, 0.4);
      transition: height 0.05s linear;
      pointer-events: none;
      z-index: 1;
    }

    .zone-btn.intruder-mode .progress-overlay {
      background: rgba(187, 128, 9, 0.4);
    }

    .zone-btn span {
      position: relative;
      z-index: 2;
    }

    .zone-btn.full-width {
      grid-column: span 2;
      min-height: 65px;
      flex-direction: row;
      gap: 10px;
    }

    .status-panel {
      background: #161b22;
      border: 1px solid #30363d;
      padding: 8px 12px;
      border-radius: 8px;
      width: 100%;
      font-size: 0.75rem;
      color: #8b949e;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logout-link {
      color: #f85149;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.75rem;
    }

    /* --- EKRANY ALARMOWE --- */
    #alarmScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    #alarmScreen.active {
      opacity: 1;
      pointer-events: auto;
    }

    #alarmScreen.type-evacuation {
      background-color: #b62324;
      animation: pulseEvac 1s infinite alternate;
    }
    @keyframes pulseEvac {
      0% { background-color: #b62324; }
      100% { background-color: #da3633; }
    }

    #alarmScreen.type-intruder {
      background-color: #1a1200;
      border: 6px solid #bb8009;
    }

    #alarmScreen h2 {
      font-size: 1.8rem;
      font-weight: 900;
      margin-bottom: 10px;
    }

    #alarmLocationText {
      font-size: 1.2rem;
      font-weight: bold;
      background: rgba(0,0,0,0.4);
      padding: 8px 16px;
      border-radius: 8px;
      margin-bottom: 15px;
      letter-spacing: 0.5px;
    }

    #alarmScreen p {
      font-size: 0.9rem;
      margin-bottom: 25px;
      max-width: 300px;
      line-height: 1.4;
    }

    .cancel-alarm-container {
      position: relative;
      width: 100%;
      max-width: 260px;
      height: 50px;
      border-radius: 25px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    #cancelBtn {
      width: 100%;
      height: 100%;
      background: #ffffff;
      color: #0d1117;
      border: none;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      position: relative;
      z-index: 2;
      outline: none;
    }

    .cancel-progress-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0%;
      height: 100%;
      background: rgba(0, 0, 0, 0.2);
      transition: width 0.05s linear;
      pointer-events: none;
      z-index: 1;
    }
  </style>
</head>
<body>

  <!-- Ekran logowania PIN -->
  <div id="loginScreen">
    <div class="login-box">
      <h2>SafeSchool</h2>
      <p>Wprowadź kod PIN nauczyciela, aby odblokować panel alarmowy.</p>
      <input type="password" id="pinInput" class="pin-input" maxlength="4" placeholder="••••">
      <button id="loginBtn" class="login-btn">Zaloguj się</button>
      <div id="loginError" class="login-error">Niepoprawny PIN!</div>
    </div>
  </div>

  <div class="app-content">
    <header>
      <h1>SafeSchool</h1>
      <p>Panel Służbowy Nauczyciela</p>
    </header>

    <div class="threat-selector">
      <button class="threat-tab active evacuation" id="tabEvacuation" data-type="evacuation">
        <span>🚨</span>
        <span>Ewakuacja (Głośna)</span>
      </button>
      <button class="threat-tab intruder" id="tabIntruder" data-type="intruder">
        <span>🥷</span>
        <span>Napastnik / Azyl (Cichy)</span>
      </button>
    </div>

    <div class="instruction" id="instructionText">Przytrzymaj strefę (2 sekundy):</div>

    <div class="zones-grid" id="zonesGrid">
      <button class="zone-btn" data-zone="Budynek A">
        <div class="progress-overlay"></div>
        <span class="zone-icon">🏫</span>
        <span>Budynek A</span>
      </button>

      <button class="zone-btn" data-zone="Budynek B">
        <div class="progress-overlay"></div>
        <span class="zone-icon">🏫</span>
        <span>Budynek B</span>
      </button>

      <button class="zone-btn" data-zone="Budynek C">
        <div class="progress-overlay"></div>
        <span class="zone-icon">🏫</span>
        <span>Budynek C</span>
      </button>

      <button class="zone-btn" data-zone="Hala Sportowa">
        <div class="progress-overlay"></div>
        <span class="zone-icon">⚽</span>
        <span>Hala Sportowa</span>
      </button>

      <button class="zone-btn full-width" data-zone="Internat Nowy">
        <div class="progress-overlay"></div>
        <span class="zone-icon">🏢</span>
        <span>Internat Nowy</span>
      </button>

      <button class="zone-btn full-width" data-zone="Internat Stary">
        <div class="progress-overlay"></div>
        <span class="zone-icon">🏡</span>
        <span>Internat Stary</span>
      </button>
    </div>

    <div class="status-panel">
      <span>Status: Zalogowano</span>
      <button id="logoutBtn" class="logout-link">Wyloguj</button>
    </div>
  </div>

  <!-- Ekran alarmowy -->
  <div id="alarmScreen">
    <h2 id="alarmTitle">🚨 ALARM!</h2>
    <div id="alarmLocationText">LOKALIZACJA</div>
    <p id="alarmDesc">Zgłoszenie aktywne.</p>
    
    <div class="cancel-alarm-container">
      <div class="cancel-progress-overlay" id="cancelProgress"></div>
      <button id="cancelBtn">PRZYTRZYMAJ 2S, ABY ODWOŁAĆ</button>
    </div>
  </div>

  <script>
    const CORRECT_PIN = "2026"; 
    const loginScreen = document.getElementById('loginScreen');
    const pinInput = document.getElementById('pinInput');
    const loginBtn = document.getElementById('loginBtn');
    const loginError = document.getElementById('loginError');
    const logoutBtn = document.getElementById('logoutBtn');

    if (localStorage.getItem('teacherLoggedIn') === 'true') {
      loginScreen.classList.add('hidden');
    }

    loginBtn.addEventListener('click', checkPin);
    pinInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') checkPin();
    });

    function checkPin() {
      if (pinInput.value === CORRECT_PIN) {
        localStorage.setItem('teacherLoggedIn', 'true');
        loginScreen.classList.add('hidden');
        loginError.style.display = 'none';
        pinInput.value = '';
      } else {
        loginError.style.display = 'block';
        pinInput.value = '';
      }
    }

    logoutBtn.addEventListener('click', () => {
      localStorage.removeItem('teacherLoggedIn');
      loginScreen.classList.remove('hidden');
    });

    let currentThreatType = 'evacuation';
    const tabEvacuation = document.getElementById('tabEvacuation');
    const tabIntruder = document.getElementById('tabIntruder');
    const zonesGrid = document.getElementById('zonesGrid');

    tabEvacuation.addEventListener('click', () => {
      currentThreatType = 'evacuation';
      tabEvacuation.className = 'threat-tab active evacuation';
      tabIntruder.className = 'threat-tab intruder';
      zonesGrid.querySelectorAll('.zone-btn').forEach(b => b.classList.remove('intruder-mode'));
    });

    tabIntruder.addEventListener('click', () => {
      currentThreatType = 'intruder';
      tabIntruder.className = 'threat-tab active intruder';
      tabEvacuation.className = 'threat-tab evacuation';
      zonesGrid.querySelectorAll('.zone-btn').forEach(b => b.classList.add('intruder-mode'));
    });

    const zoneButtons = document.querySelectorAll('.zone-btn');
    const alarmScreen = document.getElementById('alarmScreen');
    const alarmTitle = document.getElementById('alarmTitle');
    const alarmLocationText = document.getElementById('alarmLocationText');
    const alarmDesc = document.getElementById('alarmDesc');
    
    const cancelBtn = document.getElementById('cancelBtn');
    const cancelProgress = document.getElementById('cancelProgress');

    let holdTimer = null;
    let cancelTimer = null;
    const holdDuration = 2000;

    zoneButtons.forEach(btn => {
      ['mousedown', 'touchstart'].forEach(eventType => {
        btn.addEventListener(eventType, (e) => startHold(e, btn));
      });
      ['mouseup', 'mouseleave', 'touchend', 'touchcancel'].forEach(eventType => {
        btn.addEventListener(eventType, () => cancelHold(btn));
      });
    });

    function startHold(e, btn) {
      e.preventDefault();
      const overlay = btn.querySelector('.progress-overlay');
      overlay.style.transition = `height ${holdDuration}ms linear`;
      overlay.style.height = '100%';

      const zoneName = btn.getAttribute('data-zone');
      holdTimer = setTimeout(() => triggerAlarm(zoneName, currentThreatType), holdDuration);
    }

    function cancelHold(btn) {
      if (!holdTimer) return;
      clearTimeout(holdTimer);
      holdTimer = null;

      const overlay = btn.querySelector('.progress-overlay');
      const currentHeight = window.getComputedStyle(overlay).height;
      overlay.style.transition = 'none';
      overlay.style.height = currentHeight;
      
      setTimeout(() => {
        overlay.style.transition = 'height 0.2s ease';
        overlay.style.height = '0%';
      }, 10);
    }

   function triggerAlarm(zoneName, type) {
      holdTimer = null;
      zoneButtons.forEach(b => {
        b.querySelector('.progress-overlay').style.transition = 'none';
        b.querySelector('.progress-overlay').style.height = '0%';
      });

      alarmScreen.className = '';

      if (type === 'evacuation') {
        alarmScreen.classList.add('active', 'type-evacuation');
        alarmTitle.innerText = "🚨 EWAKUACJA SZKOŁY!";
        alarmDesc.innerText = "Natychmiast opuść budynek i udaj się w bezpieczne miejsce.";
        
        // Wibracja
        if ("vibrate" in navigator) {
          navigator.vibrate([400, 200, 400, 200, 600]);
        }

        // GŁOSOWY KOMUNIKAT ALARMOWY (Przeglądarka przeczyta to na głos)
        if ('speechSynthesis' in window) {
          const speech = new SpeechSynthesisUtterance(`Uwaga! Ewakuacja! ${zoneName}! Natychmiast opuść budynek!`);
          speech.lang = 'pl-PL';
          speech.rate = 1.0; // prędkość mowy
          speech.pitch = 1.1; // ton głosu
          window.speechSynthesis.speak(speech);
        }

      } else {
        alarmScreen.classList.add('active', 'type-intruder');
        alarmTitle.innerText = "🥷 NAPASTNIK / AZYL!";
        alarmDesc.innerText = "ZAMKNIJ SALĘ! Zachowaj absolutną ciszę. Telefon jest całkowicie wyciszony.";
        // BRAK DŹWIĘKU I BRAK WIBRACJI DLA AZYLU - całkowita cisza!
      }

      alarmLocationText.innerText = zoneName.toUpperCase();
    }

    function startCancelHold(e) {
      e.preventDefault();
      cancelProgress.style.transition = `width ${holdDuration}ms linear`;
      cancelProgress.style.width = '100%';

      cancelTimer = setTimeout(() => {
        dismissAlarm();
      }, holdDuration);
    }

    function stopCancelHold() {
      if (!cancelTimer) return;
      clearTimeout(cancelTimer);
      cancelTimer = null;

      const currentWidth = window.getComputedStyle(cancelProgress).width;
      cancelProgress.style.transition = 'none';
      cancelProgress.style.width = currentWidth;

      setTimeout(() => {
        cancelProgress.style.transition = 'width 0.2s ease';
        cancelProgress.style.width = '0%';
      }, 10);
    }

    function dismissAlarm() {
      cancelTimer = null;
      cancelProgress.style.transition = 'none';
      cancelProgress.style.width = '0%';
      
      alarmScreen.className = '';
      alert("✅ Sytuacja została odwołana i zresetowana.");
    }
  </script>

</body>
</html>
